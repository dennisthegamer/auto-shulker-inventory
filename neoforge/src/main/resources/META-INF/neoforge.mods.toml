loaderVersion = "[1,)"
license = "MIT"
issueTrackerURL = "https://github.com/DennisTheGamer/auto-shulker-inventory/issues"

[[mods]]
modId = "inventory_shulker"
version = "${version}"
displayName = "Auto Shulker Inventory"
displayURL = "https://modrinth.com/mod/auto-shulker-inventory"
