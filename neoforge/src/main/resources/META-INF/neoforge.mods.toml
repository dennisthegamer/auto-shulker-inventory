[[dependencies.inventory_shulker]]
modId = "minecraft"
type = "required"
versionRange = "[1.21,1.21.9)"
ordering = "NONE"
side = "BOTH"

[[dependencies.inventory_shulker]]
modId = "cloth_config"
type = "required"
versionRange = "[15.0,)"
ordering = "NONE"
side = "CLIENT"
