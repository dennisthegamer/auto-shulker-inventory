plugins {
	id 'net.neoforged.moddev'
}

// NeoForge laeuft im 26.1-Band erst ab 26.1.2; Fabric deckt 26.1-26.1.2 ab.
def mcRange = project.findProperty("minecraft_range_neoforge") ?: project.minecraft_range
version = "${project.mod_version}+mc${mcRange}"
group = project.maven_group

base {
	archivesName = "${project.archives_base_name}-neoforge"
}

// Jar files carry the Minecraft version as a suffix, e.g. ...-1.3.0-mc26.1.2.jar
tasks.withType(AbstractArchiveTask).configureEach {
	archiveVersion = "${project.mod_version}+mc${mcRange}"
}

java {
	toolchain.languageVersion = JavaLanguageVersion.of(25)
	withSourcesJar()
}

repositories {
	mavenCentral()
	maven { name = 'NeoForged'; url = 'https://maven.neoforged.net/releases/' }
	maven { name = 'Xander'; url = 'https://maven.isxander.dev/releases' }
}

// Shared code lives in common/ and is compiled directly into this jar
sourceSets.main {
	java.srcDir rootProject.file('common/src/main/java')
	resources.srcDir rootProject.file('common/src/main/resources')
}

neoForge {
	version = project.neoforge_version
	runs {
		client {
			client()
			gameDirectory = file('run')
		}
	}
	mods {
		register(project.mod_id) {
			sourceSet sourceSets.main
		}
	}
}

dependencies {
	implementation "dev.isxander:yet-another-config-lib:${project.yacl_version}-neoforge"
}

processResources {
	def props = [version: project.mod_version, mc: project.minecraft_version]
	inputs.properties props
	filesMatching('META-INF/neoforge.mods.toml') { expand props }
}

jar {
	from(rootProject.file('LICENSE')) {
		rename { "${it}_${project.archives_base_name}" }
	}
}
