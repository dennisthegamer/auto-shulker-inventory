org.gradle.jvmargs=-Xmx4G --add-opens=java.desktop/javax.imageio.spi=ALL-UNNAMED --add-opens=java.desktop/com.sun.imageio.spi=ALL-UNNAMED
org.gradle.parallel=true
org.gradle.configuration-cache=false

# Minecraft / loaders
minecraft_version=26.1.2
# Supported MC range (jar name: <mod>-<loader>-<version>+mc<range>.jar)
minecraft_range=26.1-26.1.2
# NeoForge laeuft im 26.1-Band erst ab 26.1.2 (kein lauffaehiger Floor darunter);
# Fabric deckt 26.1-26.1.2 ab. Daher eine eigene Range fuer den NeoForge-Jarnamen.
minecraft_range_neoforge=26.1.2
loader_version=0.19.3
loom_version=1.17.11
moddev_version=2.0.141
neoforge_version=26.1.2.78

# Fabric API
fabric_api_version=0.153.0+26.1.2

# Mod Properties
mod_id=inventory_shulker
mod_version=1.5.0
maven_group=de.dennisthegamer.autoshulkerinventory
archives_base_name=auto_shulker_inventory

# Dependencies (yacl gets a -fabric / -neoforge classifier per loader module)
yacl_version=3.9.5+26.1
modmenu_version=18.0.0
