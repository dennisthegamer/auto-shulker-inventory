org.gradle.jvmargs=-Xmx4G --add-opens=java.desktop/javax.imageio.spi=ALL-UNNAMED --add-opens=java.desktop/com.sun.imageio.spi=ALL-UNNAMED
org.gradle.parallel=true
org.gradle.configuration-cache=false

# Minecraft / loaders
minecraft_version=26.3
# Supported MC range (jar name: <mod>-<loader>-<version>+mc<range>.jar)
minecraft_range=26.3
loader_version=0.19.5
loom_version=1.17.21
# 2.0.141 kann MC 26.3 nicht aufsetzen: der NeoForm-Recompile scheitert an
# HolderSet$1.contents(). Erst 2.0.147 (bringt JST 2.0.11) baut 26.3.
moddev_version=2.0.147
# NeoForge 26.3.0.1-beta existiert seit 2026-09-15 (POM bindet neoform 26.3-1).
neoforge_version=26.3.0.1-beta

# Fabric API
fabric_api_version=0.160.5+26.3

# Mod Properties
mod_id=inventory_shulker
mod_version=1.5.1
maven_group=de.dennisthegamer.autoshulkerinventory
archives_base_name=auto_shulker_inventory

# Dependencies (yacl gets a -fabric / -neoforge classifier per loader module)
yacl_version=3.9.7+26.3
modmenu_version=21.0.0-beta.1
